name: 단어 제출
description: 자기 차례에 끝말잇기 단어를 제안합니다.
title: "[단어] "
body:
  - type: input
    id: game
    attributes:
      label: 게임 파일
      description: 현재 진행 중인 게임의 기록 파일을 적어 주세요.
      placeholder: games/001.txt
    validations:
      required: true
  - type: input
    id: previous-word
    attributes:
      label: 이전 단어
      description: 마지막으로 머지된 단어를 적어 주세요.
      placeholder: 기러기
    validations:
      required: true
  - type: input
    id: proposed-word
    attributes:
      label: 제안 단어
      description: 이전 단어의 마지막 글자로 시작하는 두 글자 이상의 명사를 적어 주세요.
      placeholder: 기차
    validations:
      required: true
  - type: input
    id: dictionary-url
    attributes:
      label: 사전 링크
      description: 국립국어원 표준국어대사전의 해당 단어 링크를 첨부해 주세요.
      placeholder: https://stdict.korean.go.kr/...
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: 제출 전 확인
      options:
        - label: CONTRIBUTING.md의 참여 규칙을 읽었습니다.
          required: true
        - label: 자기 차례이며 앞사람의 PR이 머지되었습니다.
          required: true
        - label: 시작 단어를 포함해 이 게임에서 사용하지 않은 단어입니다.
          required: true
        - label: 사전에 등재된 명사이며 고유명사, 비속어, 띄어쓰기가 필요한 표현이 아닙니다.
          required: true
